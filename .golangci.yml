# golangci-lint config for hersaid (PRO-7722).
# Adopted from go-service-template main: the fleet base (.golangci.base.yml) merged with
# the template's .golangci.local.yml additions (the 28 extra linters, mnd, grouper and their
# settings). Dropped from the template's local file: depguard (its rules name the template's
# layer packages, which hersaid does not have) and the huma forbidigo pattern (no huma here).
# NOT sync-enrolled: this is a plain copy, not generated by `just golangci-config`. Whether
# hersaid joins the fleet sync (base + local split) is the owner's decision.
version: '2'
run:
  tests: true
  timeout: 5m
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
linters:
  exclusions:
    paths:
    - vendor
    - internal/generated
    - ^scripts$
    - scripts/.*\.go$
    rules:
    - path: (.+)_test\.go
      linters:
      - cyclop
      - gocognit
      - gocyclo
      - funlen
      - wrapcheck
      - depguard
      - dupl
      - gosec
      - unconvert
      - thelper
      - revive
      - tparallel
      - errorlint
      - govet
      - nilnil
      - nolintlint
      - unparam
      - mnd
    - path: tests/integration/.*_test\.go
      linters:
      - paralleltest
  enable:
  - nilerr
  - govet
  - ineffassign
  - unconvert
  - bodyclose
  - contextcheck
  - copyloopvar
  - makezero
  - nilnil
  - sqlclosecheck
  - rowserrcheck
  - containedctx
  - asciicheck
  - thelper
  - tparallel
  - testifylint
  - bidichk
  - unparam
  - nolintlint
  - usestdlibvars
  - nakedret
  - errchkjson
  - loggercheck
  - sloglint
  - wastedassign
  - importas
  - mirror
  - reassign
  - nosprintfhostport
  - tagliatelle
  - usetesting
  - asasalint
  - exptostd
  - gocheckcompilerdirectives
  - gochecksumtype
  - gomoddirectives
  - iface
  - iotamixing
  - nilnesserr
  - spancheck
  - decorder
  - fatcontext
  - gochecknoinits
  - godot
  - gomodguard_v2
  - goprintffuncname
  - grouper
  - inamedparam
  - interfacebloat
  - ireturn
  - promlinter
  - recvcheck
  - testableexamples
  - unqueryvet
  - dupl
  - gocognit
  - cyclop
  - funlen
  - nonamedreturns
  - noctx
  - mnd
  - goconst
  - revive
  - predeclared
  - godox
  - dupword
  - misspell
  - prealloc
  - unused
  - durationcheck
  - gocritic
  - forcetypeassert
  - errname
  - errorlint
  - err113
  - maintidx
  - nestif
  - whitespace
  - funcorder
  - musttag
  - godoclint
  - forbidigo
  - dogsled
  - embeddedstructfieldcheck
  - canonicalheader
  - perfsprint
  - intrange
  - modernize
  - noinlineerr
  settings:
    wrapcheck:
      ignore-package-globs:
      - github.com/stretchr/testify/*
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          xml: snake
          bson: snake
          avro: snake
          mapstructure: snake
    revive:
      severity: warning
      rules:
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: package-comments
      - name: receiver-naming
      - name: var-naming
      - name: time-naming
      - name: argument-limit
        arguments:
        - 5
      - name: line-length-limit
        arguments:
        - 250
      - name: import-shadowing
      - name: defer
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: identical-branches
    gosec:
      severity: medium
      confidence: medium
    testifylint:
      enable-all: true
    goconst:
      min-len: 3
      min-occurrences: 3
      match-constant: true
      # golangci-lint 2.14 counts repeated strings inside composite literals,
      # which 2.11 did not; most of them are test-table fixtures. The list
      # skips composite literals everywhere, production code included, as 2.11
      # did. Call is the default entry that the list replaces, so call
      # arguments stay skipped too.
      exclude-types:
      - Call
      - CompositeLit
    godox:
      keywords:
      - TODO
      - FIXME
      - BUG
      - HACK
      - OPTIMIZE
      - XXX
      - FALLBACK
      - TEMP
      - DEPRECATED
      - REVIEW
      - WORKAROUND
    dupl:
      threshold: 80
    paralleltest:
      ignore-missing: false
    gocyclo:
      min-complexity: 10
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 18
    funlen:
      lines: 120
      statements: 80
    forbidigo:
      forbid:
      - pattern: ^(fmt\.Print.*|print|println)$
        msg: write to a named io.Writer (os.Stdout for CLI output) or log through slog
      - pattern: ^os\.Setenv$
        msg: use t.Setenv in tests; runtime code reads config through config.Load
    ireturn:
      allow:
      - anon
      - error
      - empty
      - stdlib
    mnd:
      checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
      ignored-numbers:
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '10'
      - '32'
      - '64'
      - '100'
      - '1024'
      ignored-functions:
      - math.*
      - strconv.*
      - time.Duration
      - make
      - cap
      - context.WithTimeout
      - context.WithDeadline
  # Linters the fleet config enables that still have findings here. The number is the
  # finding count on main when this file was adopted (PRO-7722). A PR that brings one to
  # 0 moves it back to enable in the same change.
  disable:
  - errcheck # 200
  - wrapcheck # 54
  - staticcheck # 10
  - paralleltest # 558
  - gosec # 8
  - exhaustive # 8
  - gosmopolitan # 5
severity:
  default: error
  rules:
  - path: _test\.go
    linters:
    - errcheck
    - forcetypeassert
    severity: warning
formatters:
  enable:
  - gofumpt
  - goimports
  settings:
    gofumpt:
      module-path: github.com/ledger-rocket/hersaid
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
      - github.com/ledger-rocket/hersaid
  exclusions:
    paths:
    - vendor
    - internal/apidocs
    - ^scripts$
    - scripts/.*\.go$
